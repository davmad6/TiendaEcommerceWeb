<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Ecommerce Web</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 40px; border-radius: 12px; text-align: center; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; font-size: 24px; }
        p { color: #cbd5e1; line-height: 1.5; margin-bottom: 24px; }
        a { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Tienda Ecommerce Personal</h1>
        <p>Aplicación web desarrollada en Java con Servlets (GET/POST), JSP y conexión JDBC a MySQL.</p>
        <a href="ProductoServlet">Entrar al Módulo de Productos</a>
    </div>
</body>
</html>
